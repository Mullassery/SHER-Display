name: Feature request
description: Propose new functionality for SHER-Display
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Read VISION.md's "Ownership boundaries" table first. If the feature
        you want belongs to SHER-Kernel, SHER-Graphics, SHER-Input, or
        Aurora instead of SHER-Display, it should be filed against that
        repo, not this one. Also check ROADMAP.md — it may already be
        planned in a later phase, in which case a comment on the relevant
        phase item is more useful than a new issue.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case, not just the desired API shape.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: If you have one. Otherwise leave blank and describe only the problem.

  - type: dropdown
    id: boundary
    attributes:
      label: Which subsystem should own this?
      options:
        - "SHER-Display (this repo)"
        - "SHER-Kernel"
        - "SHER-Graphics"
        - "SHER-Input"
        - "Aurora"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
