name: Bug report
description: Report a bug in SHER-Display
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: this is pre-alpha software (see README.md's "Known
        limitations"). Many things are simply not built yet, not a bug —
        check ROADMAP.md first if you're unsure whether something is
        supposed to work.

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the exact commands run and which crate(s) are involved.
      placeholder: |
        1. cargo test -p sher_display_...
        2. ...
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit / version
      description: Output of `git rev-parse HEAD` in SHER-Display, and the same for SHER-Kernel/SHER-Graphics/SHER-Input if relevant.
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Rust version (`rustc --version`), and whether you're building against local sibling checkouts of SHER-Kernel/SHER-Graphics/SHER-Input.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste any relevant `cargo build`/`cargo test` output. No need to redact — this is a systems project, not a secrets-handling one, but please don't paste anything from an unrelated private repo.
      render: shell
