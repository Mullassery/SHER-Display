name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      # This repo is consumed via relative path dependencies
      # (../SHER-Kernel/crates/..., ../SHER-Graphics/crates/...,
      # ../SHER-Input/...), so all three must be checked out as sibling
      # directories under the same workspace root as SHER-Display.
      - name: Checkout SHER-Display
        uses: actions/checkout@v4
        with:
          path: SHER-Display

      - name: Checkout SHER-Kernel
        uses: actions/checkout@v4
        with:
          repository: Mullassery/SHER-KERNEL
          path: SHER-Kernel

      - name: Checkout SHER-Graphics
        uses: actions/checkout@v4
        with:
          repository: Mullassery/SHER-Graphics
          path: SHER-Graphics

      - name: Checkout SHER-Input
        uses: actions/checkout@v4
        with:
          repository: Mullassery/SHER-INPUT
          path: SHER-Input

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            SHER-Display/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('SHER-Display/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Deliberately not `cargo fmt --all`: rustfmt's --all also formats
      # path dependencies, which would reach into the sibling repos.
      - name: cargo fmt --check
        working-directory: SHER-Display
        run: cargo fmt -- --check

      - name: cargo build --workspace
        working-directory: SHER-Display
        run: cargo build --workspace --all-targets

      - name: cargo test --workspace
        working-directory: SHER-Display
        run: cargo test --workspace

      - name: cargo clippy --workspace -- -D warnings
        working-directory: SHER-Display
        run: cargo clippy --workspace --all-targets -- -D warnings
