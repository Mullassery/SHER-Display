[workspace]
resolver = "2"
members = [
    # Core compositor pipeline (Phase 1-2) — scaffolded, tested
    "compositor",
    "scene",
    "surfaces",
    "windows",
    "workspaces",
    "outputs",
    "input",
    "cursor",

    # Security boundary — scaffolded, tested
    "security",

    # Compatibility boundary — scaffolded, tested
    "compatibility/wayland",
    "compatibility/xwayland",

    # Session & cross-cutting — scaffolded, tested
    "session",
    "diagnostics",
    "configuration",

    # Not yet scaffolded (see ROADMAP.md): clipboard, dragdrop, screenshot,
    # recording, animation, headless, ai, tests. Added to `members` as each
    # one lands rather than committed as empty placeholders.
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Georgi Mammen Mullassery <mullassery@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/Mullassery/SHER-Display"

[workspace.dependencies]
# Shared runtime deps, matching SHER-Kernel/SHER-Graphics conventions
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# SHER-Kernel (foundation types + low-level substrate)
# NOTE: the real repo is "SHER-KERNEL" (all caps, github.com/Mullassery/SHER-KERNEL).
# These paths must match that exactly: macOS/APFS resolves "SHER-Kernel" against
# an on-disk "SHER-KERNEL" directory silently (case-insensitive by default), but
# any case-sensitive filesystem -- every stock Ubuntu/ext4 install, every Linux CI
# runner -- fails `cargo check` outright with "No such file or directory" because
# no "SHER-Kernel" directory exists there, only "SHER-KERNEL". Verified by building
# in a real ubuntu:24.04 container against a non-bind-mounted (ext4-backed) copy.
sher_common = { path = "../SHER-KERNEL/crates/common" }
sher_objectmodel = { path = "../SHER-KERNEL/crates/objectmodel" }
gpu_driver = { path = "../SHER-KERNEL/crates/gpu_driver" }
wayland_server = { path = "../SHER-KERNEL/crates/wayland_server" }

# SHER-Graphics (GPU abstraction consumed by the compositor)
graphics_api = { path = "../SHER-Graphics/crates/graphics_api" }
gpu_abstraction = { path = "../SHER-Graphics/crates/gpu_abstraction" }
graphics_runtime = { path = "../SHER-Graphics/crates/graphics_runtime" }
graphics_compat = { path = "../SHER-Graphics/crates/graphics_compat" }

# SHER-Input (canonical normalized event stream; input/ used to bridge
# directly to SHER-Kernel's input_driver as a stand-in before this existed)
# NOTE: real repo is "SHER-INPUT" (all caps) -- same case-sensitivity hazard as above.
sher_input_core = { path = "../SHER-INPUT/crates/core" }
sher_input_test = { path = "../SHER-INPUT/crates/test-support" }

# SHER-Display internal crates
sher_display_compositor = { path = "compositor" }
sher_display_scene = { path = "scene" }
sher_display_surfaces = { path = "surfaces" }
sher_display_windows = { path = "windows" }
sher_display_workspaces = { path = "workspaces" }
sher_display_outputs = { path = "outputs" }
sher_display_input = { path = "input" }
sher_display_cursor = { path = "cursor" }
sher_display_security = { path = "security" }
sher_display_compat_wayland = { path = "compatibility/wayland" }
sher_display_compat_xwayland = { path = "compatibility/xwayland" }
sher_display_session = { path = "session" }
sher_display_diagnostics = { path = "diagnostics" }
sher_display_configuration = { path = "configuration" }
